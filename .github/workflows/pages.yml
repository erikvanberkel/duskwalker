# Builds the single-file web version (tools/build-html.mjs) and publishes it to GitHub Pages
# on every push to master. Play at https://erikvanberkel.github.io/duskwalker/
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts skips Electron's ~100 MB binary download; the web build only needs esbuild.
      - run: npm ci --ignore-scripts
      - run: node tools/build-html.mjs
      - name: Stage site
        run: |
          mkdir -p site
          cp dist/Duskwalker.html site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
